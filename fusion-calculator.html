<!--
 * ------------------------------------------------------------
 * FILE: fusion-calculator.html
 * ------------------------------------------------------------
 *
 * Expanded Hand Calculator for Yu-Gi-Oh! Forbidden Memories.
 * Allows inputting an expanded hand of up to 800 cards to
 * calculate all possible 2-card fusions and sequence chains.
 *
 * Includes the unified 2-row navigation bar matching index.html.
 * ------------------------------------------------------------
-->
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Yu-Gi-Oh! Forbidden Memories fusion list" />
        <meta name="keywords" content="Yu-Gi-Oh!, YuGiOh, Forbidden Memories, playstation, Fusion" />
        <meta name="robots" content="index, follow" />
        <title>Fusion Calculator</title>
        <link rel="icon" type="image/x-icon" href="public/images/yugioh.ico" />
        <link rel="stylesheet" type="text/css" href="public/styles/normalize.css" />
        <link rel="stylesheet" type="text/css" href="public/styles/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="public/styles/home.css" />
        <link rel="stylesheet" type="text/css" href="public/styles/fusioncustom.css" />
        <link rel="stylesheet" type="text/css" href="public/styles/awesomplete.css" />
    </head>
    <body class="bg-dark d-flex flex-column min-vh-100 polymerization fusion-calculator-page">
        <!--
         * ------------------------------------------------------------
         * 1. NAVIGATION BAR
         *
         * Standardized header navigation matching index.html.
         * ------------------------------------------------------------
        -->
        <header class="navbar navbar-expand-lg navbar-light bg-light">
            <!-- Brand Logo -->
            <a class="navbar-brand text-truncate" href="index.html">
                <img
                    class="img-fluid ml-4"
                    id="logo"
                    src="public/images/logo.png"
                    alt="Yu-Gi-Oh! Forbidden Memories Logo"
                />
            </a>

            <!-- Mobile Navbar Toggler Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-toggle="collapse"
                data-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon d-md-none p-0 mx-2 collapsed"></span>
            </button>

            <!-- Navigation Links (Stacked 2-line labels with vertical dividers) -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ml-auto">
                    <!-- Link: Fusion Search -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="fusion-search.html">
                            <span>Fusion</span>
                            <span>Search</span>
                        </a>
                    </li>

                    <!-- Link: Fusion Calculator -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="fusion-calculator.html">
                            <span>Fusion</span>
                            <span>Calculator</span>
                        </a>
                    </li>

                    <!-- Link: Fusion Statistics -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="fusion-stats.html">
                            <span>Fusion</span>
                            <span>Statistics</span>
                        </a>
                    </li>

                    <!-- Link: Glitch Fusions -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="glitch-fusions.html">
                            <span>Glitch</span>
                            <span>Fusions</span>
                        </a>
                    </li>

                    <!-- Link: Equip Statistics -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="equip-stats.html">
                            <span>Equip</span>
                            <span>Statistics</span>
                        </a>
                    </li>

                    <!-- Link: Field Statistics -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="field-stats.html">
                            <span>Field</span>
                            <span>Statistics</span>
                        </a>
                    </li>

                    <!-- Link: About -->
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="about.html">
                            <span>About</span>
                        </a>
                    </li>
                </ul>
            </div>
        </header>

        <!--
         * ------------------------------------------------------------
         * 2. MAIN CALCULATOR CONTAINER & CONTROLS
         * ------------------------------------------------------------
        -->
        <main class="container">
            <section class="row mt-3 rounded-lg bg-light fusion-calculator-panel">
                <div class="col">
                    <div class="row my-3">
                        <div class="col">
                            <h2 class="my-3 text-main fusion-calculator-heading">ENTER HAND</h2>

                            <div class="hand-controls">
                                <div class="hand-page-navigation">
                                    <button type="button" class="btn btn-secondary" id="hand-prev">Previous</button>
                                    <span id="hand-page-label" class="hand-page-label">Cards 1-5 of 800</span>
                                    <button type="button" class="btn btn-secondary" id="hand-next">Next</button>
                                </div>
                                <div class="hand-actions">
                                    <button type="button" class="btn btn-primary" id="btn-calc">Calculate</button>
                                    <button type="button" class="btn btn-danger" id="btn-reset">Reset</button>
                                </div>
                            </div>

                            <div class="form-row" id="hand-inputs-container"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Results Section -->
            <section class="row my-3 rounded-lg bg-light d-none" id="results-panel">
                <div class="col my-3">
                    <h2 class="text-main mb-3 text-center">FUSION RESULTS</h2>
                    <div id="results"></div>
                </div>
            </section>
        </main>

        <!--
         * ------------------------------------------------------------
         * 3. FOOTER
         * ------------------------------------------------------------
        -->
        <footer class="container-fluid">
            <div class="row footer-bottom m-0">
                <div class="col text-center p-0 my-0">
                    <a class="text-white" href="https://github.com/Solumin/YGO-FM-FusionCalc" rel="noopener noreferrer" target="_blank">YGO-FM-FusionCalc on Github</a>
                </div>
            </div>
        </footer>

        <!-- Scripts -->
        <script src="public/javascripts/jquery-3.5.1.min.js"></script>
        <script src="public/javascripts/bootstrap.bundle.min.js"></script>
        <script src="public/javascripts/awesomplete.min.js"></script>
        <script src="public/javascripts/taffy.js"></script>
        <script src="data/cards.js"></script>
        <script src="data/fusions.js"></script>
        <script src="data/results.js"></script>
        <script src="data/equips.js"></script>
        <script src="data/types_and_stars.js"></script>
        <script src="public/javascripts/fusionCalc.js"></script>
    </body>
</html>
